# Which licence covers which file, in the machine-readable REUSE format
# (https://reuse.software). Check it with `reuse lint`; CI does on every PR.
#
# The short version, for people:
#   code (scripts, tools, scenes, project files)  MIT
#   our own content (texts, jokes, art, docs)     CC BY-SA 4.0
#   map data derived from OpenStreetMap           ODbL 1.0
#   third-party assets                            their own licence (CC0, OFL)
# Full texts are in LICENSES/. Sources of every third-party file: CREDITS.md
# and assets/CREDITS.md.
#
# Later entries override earlier ones for the files they match.

version = 1

# Everything not matched below is code or configuration.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 BTA 7 Almosh City contributors"
SPDX-License-Identifier = "MIT"

# Our own writing and pictures: game texts, docs, artwork, screenshots.
[[annotations]]
path = [
    "data/world.json",
    "data/encounters*.json",
    "docs/**",
    "assets/art/**",
    "assets/textures/palm_frond.png",
    "assets/textures/palm_frond.png.import",
    "**/*.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 BTA 7 Almosh City contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The licence texts themselves are not ours to licence.
[[annotations]]
path = ["LICENSES/**", "assets/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Map data: a derived database of OpenStreetMap, so it stays under the ODbL.
[[annotations]]
path = ["data/city.json", "data/dressing.json", "data/dressing.bin"]
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"

# --- third-party assets (see assets/CREDITS.md for each source) ---

[[annotations]]
path = ["assets/characters/**", "assets/vehicles/**", "assets/props/**"]
precedence = "override"
SPDX-FileCopyrightText = "Quaternius (quaternius.com)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["assets/audio/sfx/**", "assets/audio/radio/*.ogg", "assets/audio/radio/*.ogg.import"]
precedence = "override"
SPDX-FileCopyrightText = "Kenney (kenney.nl)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "assets/audio/radio/shellac/**"
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
SPDX-FileComment = "Public domain recordings via Wikimedia Commons; see assets/CREDITS.md"

[[annotations]]
path = "assets/textures/**"
precedence = "override"
SPDX-FileCopyrightText = "Poly Haven (polyhaven.com) and ambientCG (ambientcg.com)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["assets/textures/palm_frond.png", "assets/textures/palm_frond.png.import"]
precedence = "override"
SPDX-FileCopyrightText = "2026 BTA 7 Almosh City contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "assets/fonts/Heebo-*"
precedence = "override"
SPDX-FileCopyrightText = "The Heebo Project Authors (Oded Ezer, Meir Sadan)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "assets/fonts/SecularOne-*"
precedence = "override"
SPDX-FileCopyrightText = "Michal Sahar"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "assets/fonts/Karantina-*"
precedence = "override"
SPDX-FileCopyrightText = "Rony Koch"
SPDX-License-Identifier = "OFL-1.1"

# Fonts used only to draw the logo (tools/art/make_logo.py); not shipped in the game.
[[annotations]]
path = "tools/art/fonts/Monoton-*"
precedence = "override"
SPDX-FileCopyrightText = "2011 Vernon Adams"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "tools/art/fonts/Pacifico-*"
precedence = "override"
SPDX-FileCopyrightText = "2018 The Pacifico Project Authors"
SPDX-License-Identifier = "OFL-1.1"
